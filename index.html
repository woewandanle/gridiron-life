:root{
  --ink:#0d1120; --navy:#1b2547; --navy2:#26335f; --navy3:#121a33;
  --white:#fbfaf2; --dim:#a7b1d4; --yellow:#ffd23f; --red:#ff5a5f; --green:#3ddc84; --blue:#4cc3ff; --orange:#ff9f1c; --purple:#c39bff;
  --f1:#2e8b3a; --f2:#287d33;
  --px:'Press Start 2P','Courier New',monospace;
  --vt:'VT323','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:var(--vt);font-size:21px;line-height:1.15;color:var(--white);
  background-color:var(--f1);
  background-image:
    linear-gradient(rgba(9,13,28,.62),rgba(9,13,28,.80)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 3px,transparent 3px 120px),
    repeating-linear-gradient(90deg,var(--f1) 0 60px,var(--f2) 60px 120px);
  background-attachment:fixed;
  overflow-x:hidden;user-select:none;-webkit-user-select:none;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column}
.px{font-family:var(--px);letter-spacing:.02em}
.y{color:var(--yellow)}.g{color:var(--green)}.r{color:var(--red)}.b{color:var(--blue)}.o{color:var(--orange)}.d{color:var(--dim)}.p{color:var(--purple)}
.sh{text-shadow:2px 2px 0 #000}

/* ---------- buttons ---------- */
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--px);font-size:10px;line-height:1.35;text-transform:uppercase;text-align:center;
  padding:12px 10px;background:var(--navy2);color:var(--white);border:3px solid #000;
  box-shadow:0 4px 0 #000,inset 0 -4px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.12);
  position:relative;transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #000,inset 0 -2px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.38;cursor:default}
.btn small{font-family:var(--vt);font-size:17px;text-transform:none;opacity:.9;letter-spacing:0}
.btn.yb{background:var(--yellow);color:#111}
.btn.gb{background:#1f9e57;color:#fff}
.btn.rb{background:#c9353d;color:#fff}
.btn.bb{background:#1f6fb2;color:#fff}
.btn.ob{background:#d9731a;color:#fff}
.btn.full{width:100%}
.btn.big{font-size:13px;padding:16px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:430px){.grid3{grid-template-columns:1fr}}
.mt{margin-top:10px}.mt2{margin-top:16px}

/* ---------- panels ---------- */
.panel{background:var(--navy);border:3px solid #000;box-shadow:0 5px 0 rgba(0,0,0,.7);margin-bottom:14px}
.ph{background:var(--navy2);border-bottom:3px solid #000;padding:9px 10px;font-family:var(--px);font-size:10px;line-height:1.4;
  display:flex;justify-content:space-between;align-items:center;gap:8px;text-transform:uppercase}
.ph.yh{background:var(--yellow);color:#111}
.ph.gh{background:#1f9e57}
.ph.rh{background:#b7323a}
.ph.bh{background:#1f6fb2}
.pb{padding:12px}
.hint{color:var(--dim);font-size:18px;margin:6px 0 10px}
.tag{display:inline-block;font-family:var(--px);font-size:8px;padding:4px 6px;border:2px solid #000;background:#000;color:var(--yellow);text-transform:uppercase;vertical-align:middle}
.tag.g{background:#1f9e57;color:#fff}.tag.r{background:#c9353d;color:#fff}.tag.b{background:#1f6fb2;color:#fff}.tag.y{background:var(--yellow);color:#111}.tag.n{background:var(--navy3);color:var(--dim)}
.kv{width:100%;border-collapse:collapse;font-size:19px}
.kv td,.kv th{border-bottom:2px solid #0b1022;padding:5px 4px;text-align:left;vertical-align:top}
.kv th{font-family:var(--px);font-size:8px;color:var(--dim);text-transform:uppercase}
.kv td.n{text-align:right;white-space:nowrap}
.big-num{font-family:var(--px);font-size:20px;color:var(--yellow);text-shadow:3px 3px 0 #000}
.stat-line{font-family:var(--vt);font-size:19px;background:#0a0f20;border:2px dashed #2f3d6e;padding:6px 8px;color:var(--yellow);margin-top:8px}

/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:30;background:var(--navy3);border-bottom:4px solid #000;padding:8px 10px 10px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.h-top{display:flex;align-items:center;gap:10px}
.h-av{width:52px;height:52px;border:3px solid #000;background:#0b1530;flex-shrink:0}
.h-id{flex:1;min-width:0}
.h-name{font-family:var(--px);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.h-team{font-size:19px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.chipc{width:12px;height:12px;border:2px solid #000;display:inline-block;flex-shrink:0}
.h-gear{width:38px;height:38px;font-family:var(--px);font-size:14px;background:var(--navy2);border:3px solid #000;box-shadow:0 3px 0 #000}
.h-cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.h-cell{background:#000;border:2px solid #2a3561;padding:4px 2px;text-align:center}
.h-cell .v{font-family:var(--px);font-size:11px;color:var(--yellow);line-height:1.5;white-space:nowrap}
.h-cell .k{font-size:15px;color:var(--dim);text-transform:uppercase;line-height:1}

/* ---------- tabs ---------- */
#view{flex:1;padding:14px 12px 96px}
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--navy3);border-top:4px solid #000;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{font-family:var(--px);font-size:9px;padding:10px 2px;color:var(--dim);border:3px solid transparent;text-transform:uppercase}
.tab.on{color:#111;background:var(--yellow);border-color:#000;box-shadow:0 3px 0 #000}
.tab .dot{display:inline-block;width:7px;height:7px;background:var(--red);border:1px solid #000;margin-left:3px;vertical-align:top}

/* ---------- attributes ---------- */
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:400px){.attr-grid{grid-template-columns:1fr}}
.attr{display:block;text-align:left;background:#0e1531;border:3px solid #000;padding:6px 8px 7px;box-shadow:0 3px 0 #000}
.attr.on{background:#16224a}
.attr.on:hover{border-color:var(--yellow)}
.attr.on:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.attr:disabled{cursor:default}
.attr .at{display:flex;justify-content:space-between;align-items:baseline;font-size:19px}
.attr .at span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attr.sk .at span{color:var(--yellow)}
.attr .at b{font-family:var(--px);font-size:11px;color:var(--green)}
.attr .at b i{font-style:normal;color:var(--dim);font-size:9px}
.bar{position:relative;height:9px;background:#000;border:2px solid #000;margin-top:4px;overflow:hidden}
.fill{height:100%;background:repeating-linear-gradient(90deg,#3ddc84 0 6px,#2fbf71 6px 8px)}
.attr.sk .fill{background:repeating-linear-gradient(90deg,#ffd23f 0 6px,#e8b923 6px 8px)}
.cap{position:absolute;top:-2px;bottom:-2px;width:3px;background:#fff}
.cost{font-size:15px;color:var(--dim);margin-top:2px}
.cost.hi{color:var(--orange)}.cost.lo{color:var(--dim)}
.attr.over .cap{background:var(--red)}
.prog{height:4px;background:#000;margin-top:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue)}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:4px 0 2px}
.kchip{background:#0a0f20;border:2px solid #2a3561;padding:4px 5px;font-size:15px;line-height:1.05;color:var(--dim)}
.kchip b{display:block;font-family:var(--px);font-size:8px;margin-bottom:3px;color:var(--white)}
.kchip.g b{color:var(--green)}.kchip.r b{color:var(--red)}
.die.bonus{background:var(--yellow)}

/* ---------- dice ---------- */
.dice-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.die{width:48px;height:48px;background:#fff;border:3px solid #000;box-shadow:0 4px 0 #000;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px;gap:2px}
.die i{display:block}
.die i.p{background:#111;border-radius:0}
.die.six i.p{background:#d62828}
.die.act{outline:4px solid var(--yellow);outline-offset:2px;animation:bob .6s ease-in-out infinite alternate}
.die.used{opacity:.25;transform:scale(.85)}
.die.roll{animation:roll .45s steps(6) 1}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes roll{0%{transform:rotate(0)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg)}}

/* ---------- scoreboard ---------- */
.board{background:#000;border:4px solid #000;outline:3px solid #2a3561;padding:10px;margin-bottom:12px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sb-t{text-align:center}
.sb-ab{display:inline-block;font-family:var(--px);font-size:11px;padding:6px 8px;border:3px solid #fff;color:#fff;min-width:64px}
.sb-sc{font-family:var(--px);font-size:34px;color:var(--yellow);margin-top:8px;text-shadow:0 0 8px rgba(255,210,63,.5)}
.sb-mid{font-family:var(--px);font-size:9px;color:var(--dim);text-align:center;line-height:1.7}
.sb-foot{font-size:18px;text-align:center;color:var(--white);margin-top:8px;min-height:22px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px;margin-top:10px}
.res div{font-family:var(--px);font-size:8px;padding:6px 3px;text-align:center;border:2px solid #000;line-height:1.6}
.res .w{background:#1f9e57}.res .l{background:#b7323a}.res .u{background:#0e1531;color:var(--dim)}
.res .pg{outline:2px solid var(--yellow)}

/* ---------- coach / dialog ---------- */
.coach{display:flex;gap:12px;align-items:flex-start}
.coach canvas{width:72px;height:72px;border:3px solid #000;background:#0b1530;flex-shrink:0}
.bubble{position:relative;background:var(--white);color:#111;border:3px solid #000;padding:8px 10px;font-size:20px;flex:1}
.bubble b{font-family:var(--px);font-size:9px;display:block;margin-bottom:6px;color:#1f6fb2}

/* ---------- offers / cards ---------- */
.offer{background:#0e1531;border:3px solid #000;padding:10px;margin-bottom:10px;box-shadow:0 3px 0 #000}
.offer.hot{border-color:var(--yellow)}
.offer-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.offer-n{font-family:var(--px);font-size:10px;line-height:1.5}
.offer .kv{font-size:18px}
.hearts{font-family:var(--px);font-size:13px;color:var(--red);letter-spacing:3px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .btn{min-width:44px;padding:8px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-family:var(--px);font-size:9px;padding:8px 9px;border:3px solid #000;background:#0e1531;color:var(--dim)}
.pill.on{background:var(--yellow);color:#111}

/* ---------- feed ---------- */
.yr{margin-bottom:10px}
.yr-h{width:100%;text-align:left;font-family:var(--px);font-size:9px;padding:9px 10px;background:#000;color:var(--yellow);border:3px solid #000}
.card{background:var(--navy);border:3px solid #000;border-left-width:8px;padding:8px 10px;margin-top:6px}
.card.good{border-left-color:var(--green)}.card.bad{border-left-color:var(--red)}.card.gold{border-left-color:var(--yellow)}.card.money{border-left-color:var(--blue)}
.card h4{font-family:var(--px);font-size:9px;line-height:1.5;margin-bottom:4px;color:var(--dim);text-transform:uppercase}
.card.gold h4{color:var(--yellow)}.card.good h4{color:var(--green)}.card.bad h4{color:var(--red)}.card.money h4{color:var(--blue)}
.card p{font-size:19px}

/* ---------- title & creator ---------- */
.title-wrap{padding:28px 14px 30px;display:flex;flex-direction:column;gap:14px}
.logo{text-align:center;padding:18px 8px 6px}
.logo h1{font-family:var(--px);font-size:30px;line-height:1.2;color:var(--white);text-shadow:4px 4px 0 #000,-2px -2px 0 #000}
.logo h1 span{color:var(--yellow)}
.logo p{font-size:21px;color:var(--dim);margin-top:10px}
.lights{display:flex;justify-content:center;gap:40px;margin-bottom:10px}
.lights i{width:46px;height:14px;background:#fff8c7;border:3px solid #000;box-shadow:0 0 22px 8px rgba(255,248,199,.35)}
.lang{display:flex;justify-content:center;gap:6px}
.face-wrap{display:flex;gap:12px;align-items:flex-start}
@media(max-width:430px){.face-wrap{flex-direction:column;align-items:center}}
#face-cv{width:120px;height:120px;border:3px solid #000;background:#0b1530;box-shadow:0 4px 0 #000}
.inp{width:100%;background:#000;border:3px solid #2a3561;padding:7px 8px;font-size:21px;color:var(--white)}
.inp:focus{outline:none;border-color:var(--yellow)}
.lbl{font-family:var(--px);font-size:8px;color:var(--dim);display:block;margin:0 0 5px;text-transform:uppercase}
.lbl.mt{margin-top:14px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
@media(max-width:430px){.chips{grid-template-columns:repeat(2,1fr)}}
.chip{font-size:17px;padding:5px 4px;background:#0e1531;border:3px solid #000;text-align:center}
.chip:hover{border-color:var(--yellow)}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:430px){.pos-grid{grid-template-columns:1fr 1fr}}
.pos{text-align:left;background:#0e1531;border:3px solid #000;padding:7px;box-shadow:0 3px 0 #000}
.pos.on{background:var(--yellow);color:#111}
.pos b{font-family:var(--px);font-size:9px;display:block;line-height:1.5}
.pos span{font-size:16px;opacity:.85;display:block;line-height:1.05;margin-top:3px}


/* ---------- scouting dossier (paper file, deliberately unlike the dark Play panels) ---------- */
.dossier{position:relative;background:#efe6cc;color:#1f1b14;border:3px solid #000;box-shadow:0 5px 0 rgba(0,0,0,.7);margin-bottom:14px;padding:0 12px 12px;
  background-image:repeating-linear-gradient(transparent 0 25px,rgba(60,40,10,.07) 25px 26px);font-size:19px;overflow:hidden}
.dz-top{display:flex;justify-content:space-between;gap:8px;margin:0 -12px 10px;padding:8px 12px;background:#1f1b14;color:#efe6cc;font-family:var(--px);font-size:8px;line-height:1.5;text-transform:uppercase}
.dz-top span:last-child{color:#c9a227;text-align:right}
.dz-stamp{position:absolute;top:44px;right:8px;transform:rotate(9deg);font-family:var(--px);font-size:9px;color:#b3202f;border:3px solid #b3202f;padding:5px 6px;opacity:.82;background:rgba(239,230,204,.7);z-index:2}
.dz-bio{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;margin-top:18px}
.dz-bio canvas{width:64px;height:64px;border:3px solid #1f1b14;background:#0b1530}
.dz-id{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.dz-id b{font-family:var(--px);font-size:10px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz-id span{font-size:17px;color:#4a4232;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dz-grade{border:3px solid #1f1b14;background:#fffaf0;padding:6px 8px;text-align:center;min-width:96px;box-shadow:3px 3px 0 #1f1b14}
.dz-num{font-family:var(--px);font-size:18px;color:#b3202f;line-height:1.3}
.dz-stars{font-size:22px;color:#b3202f;letter-spacing:1px;line-height:1}.dz-stars i{font-style:normal;color:#cfc3a3}
.dz-gl{font-family:var(--px);font-size:7px;line-height:1.5;margin-top:4px;max-width:120px}
.dz-gs{font-size:15px;color:#4a4232;margin-top:2px}
@media(max-width:400px){.dz-bio{grid-template-columns:56px 1fr}.dz-grade{grid-column:1/-1}.dz-gl{max-width:none}}
.dz-arch{margin:12px 0 2px;font-family:var(--px);font-size:8px;line-height:1.6;color:#4a4232}
.dz-arch b{color:#1d3f8c;font-size:10px}
.dz-radar{display:flex;flex-direction:column;align-items:center;margin:2px 0 6px}
.radar{width:100%;max-width:300px;display:block}
.radar .rg{fill:none;stroke:#b9ad8c;stroke-width:1}
.radar .rg.avg{stroke:#8f8466;stroke-dasharray:2 2}
.radar .rp{fill:none;stroke:#1d3f8c;stroke-width:1.5;stroke-dasharray:4 3}
.radar .rv{fill:rgba(179,32,47,.28);stroke:#b3202f;stroke-width:2;stroke-linejoin:round}
.radar .rd{fill:#b3202f}
.radar text{text-anchor:middle;dominant-baseline:middle}
.radar .rl{font-family:'Press Start 2P',monospace;font-size:7px;fill:#4a4232}
.radar .rl.rk{fill:#b3202f}
.radar .rn{font-family:'VT323',monospace;font-size:13px;fill:#1f1b14}
.dz-leg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:15px;color:#4a4232}
.dz-leg i{display:inline-block;width:14px;height:8px;margin-right:4px;vertical-align:middle}
.dz-leg .lv{background:rgba(179,32,47,.5);border:2px solid #b3202f}.dz-leg .lp{border:2px dashed #1d3f8c}.dz-leg .lk{background:#b3202f;width:8px}
.dz-tools{width:100%;border-collapse:collapse;font-size:18px;margin:4px 0 8px}
.dz-tools th{font-family:var(--px);font-size:7px;text-align:left;color:#4a4232;border-bottom:2px solid #1f1b14;padding:4px 3px}
.dz-tools td{padding:3px;border-bottom:1px dashed #b9ad8c}
.dz-tools .n{text-align:right}
.dz-tools tr.key td:first-child{color:#b3202f}
.dz-tools tr.key td:first-child::before{content:'■ ';font-size:11px}
.dz-meas{display:flex;flex-wrap:wrap;gap:6px 12px;background:#1f1b14;color:#efe6cc;padding:6px 8px;font-size:16px;margin-bottom:6px}
.dz-meas b{color:#c9a227}
.dz-meas em{flex-basis:100%;font-style:normal;color:#a99f86;font-size:14px}
.dossier h5{font-family:var(--px);font-size:8px;text-transform:uppercase;margin:10px 0 4px;padding-bottom:3px;border-bottom:2px solid #1f1b14}
.dossier ul{list-style:none}
.dossier li{padding-left:16px;position:relative;margin-bottom:3px;line-height:1.1}
.dz-s li::before{content:'+';position:absolute;left:0;color:#1e7a3c;font-family:var(--px);font-size:10px;top:2px}
.dz-w li::before{content:'−';position:absolute;left:0;color:#b3202f;font-family:var(--px);font-size:10px;top:2px}
.dz-q{font-style:italic;color:#3b3427;border-left:4px solid #c9a227;padding-left:8px}
.dz-foot{font-size:14px;color:#7a6f57;margin-top:10px}


/* ---------- stats-reference table ---------- */
.sref{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:3px solid #000}
.sref table{border-collapse:separate;border-spacing:0;font-size:18px;white-space:nowrap;min-width:100%}
.sref th{font-family:var(--px);font-size:7px;color:var(--dim);background:#0a0f20;padding:7px 6px;text-align:right;border-bottom:2px solid #000;position:sticky;top:0}
.sref td{padding:4px 6px;text-align:right;border-bottom:1px solid #121a33}
.sref tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.sref .stk{position:sticky;left:0;text-align:left;background:#1b2547;z-index:1;border-right:2px solid #000}
.sref tr:nth-child(even) td.stk{background:#1f2a52}
.sref .lvs{position:sticky;left:6px}
.sref th.stk{background:#0a0f20;z-index:2}
.sref td:nth-child(3),.sref td:nth-child(4),.sref th:nth-child(3),.sref th:nth-child(4){text-align:left}
.sref .aw{text-align:left;color:var(--yellow);font-size:16px}
.sref tr.lvl td{background:#000!important;color:var(--yellow);font-family:var(--px);font-size:8px;padding:7px 6px;text-align:left}
.sref tr.tot td{background:#16224a!important;color:var(--yellow);font-weight:bold;border-top:2px solid #000}
.sref tr.ch td{color:var(--yellow)}
.sref tr.ch td.stk::after{content:' 🏆';font-size:12px}
.sref-key{font-size:15px;color:var(--dim);line-height:1.15}
.sref-key p{margin-bottom:6px}.sref-key b{color:var(--white)}

/* ---------- awards voting ---------- */
.vote{background:#0e1531;border:3px solid #000;padding:8px 10px;margin-bottom:8px}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.vh b{font-family:var(--px);font-size:9px;line-height:1.5}
.vb{display:flex;flex-wrap:wrap;gap:6px}
.vb span{flex:1;min-width:70px;background:#000;border:2px solid #2a3561;padding:4px 6px;font-size:15px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.vb b{font-family:var(--px);font-size:10px;color:var(--white)}.vb b.g{color:var(--green)}
.vn{font-size:16px;color:var(--dim);margin-top:5px}

/* ---------- aging curve ---------- */
.agebar{display:grid;grid-template-columns:repeat(auto-fit,minmax(22px,1fr));gap:2px;margin-bottom:6px}
.agebar i{height:34px;border:2px solid #000;display:flex;align-items:flex-end;justify-content:center;font-style:normal}
.agebar b{font-size:13px;color:#000;line-height:1}
.ag-g{background:#3ddc84}.ag-p{background:var(--yellow)}.ag-f{background:#4cc3ff}.ag-d{background:var(--red)}
.agebar i.now{outline:3px solid #fff;outline-offset:1px;transform:translateY(-3px)}
.ag-leg{display:flex;flex-wrap:wrap;gap:10px;font-size:15px;color:var(--dim);margin-bottom:6px}
.ag-leg i{display:inline-block;width:12px;height:10px;border:2px solid #000;margin-right:4px;vertical-align:middle}

/* ---------- Hall of Legends board (matches the panel/offer look) ---------- */
.hs-list{padding:10px 10px 2px}
.hs-tabs{display:flex;flex-wrap:wrap;gap:5px;padding:10px 10px 0}
.hs-tabs .pill{padding:7px 7px;font-size:8px}
.hs-row{width:100%;display:grid;grid-template-columns:34px 44px 1fr auto;gap:8px;align-items:center;text-align:left;background:#0e1531;border:3px solid #000;box-shadow:0 3px 0 #000;padding:6px 8px;margin-bottom:8px}
.hs-row:hover,.hs-row:focus{border-color:var(--yellow);outline:none}
.hs-row:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.hs-rk{font-family:var(--px);font-size:12px;width:30px;height:30px;display:grid;place-items:center;border:3px solid #000;background:#26335f;color:var(--white)}
.hs-rk.m1{background:var(--yellow);color:#111}.hs-rk.m2{background:#cbd5e1;color:#111}.hs-rk.m3{background:#d9731a;color:#111}
.hs-row canvas{width:44px;height:44px;border:3px solid #000;background:#0b1530}
.hs-nm{font-family:var(--px);font-size:9px;line-height:1.6;min-width:0;word-break:break-word}
.hs-nm em{display:block;font-style:normal;font-family:var(--vt);font-size:15px;line-height:1.1;color:var(--dim)}
.hs-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:96px}
.hs-earn{font-family:var(--vt);font-size:17px;font-weight:normal;color:var(--green);white-space:nowrap;text-align:right}
.hs-earn::before{content:'💰 ';font-size:13px}
.hs-sc{font-family:var(--px);font-size:12px;color:var(--yellow);text-shadow:2px 2px 0 #000;background:#000;border:2px solid #2a3561;padding:6px 5px}
.hs-tip{font-size:16px;color:var(--dim);text-align:center;margin:0 0 8px}
.hs-foot{font-family:var(--px);font-size:7px;color:var(--dim);text-align:center;border-top:3px solid #000;background:var(--navy3);padding:8px}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.natlist{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;background:#0a0f20;border:2px dashed #2a3561;padding:8px;margin-top:8px;font-size:16px;color:var(--dim)}
.natlist b{grid-column:1/-1;font-size:17px;color:var(--white);font-weight:normal}
.natlist .pill{padding:6px 8px}
.hallcard .hc-top{display:flex;gap:12px;align-items:center}
.hallcard canvas{width:84px;height:84px;border:3px solid #000;background:#0b1530;flex-shrink:0}
.hallcard .px{font-size:11px;line-height:1.6}
.hc-badges{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.hc-lv{background:#0e1531;border:3px solid #000;padding:8px;margin-top:8px}
.hc-lv h5{font-family:var(--px);font-size:9px;color:var(--yellow);margin-bottom:4px}
.hc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.hc-grid span{background:#000;border:2px solid #2a3561;padding:3px 5px;font-size:14px;color:var(--dim)}
.hc-grid b{display:block;font-size:19px;color:var(--white)}
.selectable{user-select:text;-webkit-user-select:text}
.seedbox{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-top:8px}
.seedbox .inp{text-align:center;font-size:20px;letter-spacing:1px}
.seedbox .btn{padding:9px 10px}
/* ---------- stacked trophy case ---------- */
.trophies{display:grid;gap:6px}
.trophy{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;background:#0e1531;border:3px solid #000;padding:5px 8px}
.tr-ic{font-size:20px;text-align:center}
.tr-n{font-size:19px;line-height:1.05}.tr-n em{display:block;font-style:normal;font-size:15px;color:var(--dim);margin-top:2px}
.tr-x{font-family:var(--px);font-size:12px;color:var(--yellow);text-shadow:2px 2px 0 #000}
/* ---------- short 16:9 frames (Poki desktop is ~470px tall) ---------- */
@media (max-height:560px){
  #hud{padding:5px 8px 6px}.h-av{width:38px;height:38px}.h-gear{width:32px;height:32px}
  .h-name{font-size:9px}.h-team{font-size:16px}.h-cells{margin-top:5px;gap:4px}
  .h-cell{padding:2px}.h-cell .v{font-size:9px}.h-cell .k{font-size:13px}
  .tab{padding:7px 2px;font-size:8px}#view{padding:10px 10px 72px}
}
/* ---------- modal & toasts ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(4,7,16,.86);display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{width:100%;max-width:500px;max-height:90vh;overflow:auto;background:var(--navy);border:4px solid #000;outline:3px solid var(--yellow);box-shadow:0 8px 0 #000}
#toasts{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:480px}
.toast{font-family:var(--px);font-size:10px;line-height:1.5;padding:9px 12px;background:#000;border:3px solid var(--yellow);color:var(--yellow);animation:tin 1.9s ease forwards;text-align:center}
.toast.good{border-color:var(--green);color:var(--green)}.toast.bad{border-color:var(--red);color:var(--red)}.toast.money{border-color:var(--blue);color:var(--blue)}
@keyframes tin{0%{opacity:0;transform:translateY(12px) scale(.9)}12%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.stamp{display:inline-block;font-family:var(--px);font-size:14px;padding:10px 14px;border:4px solid currentColor;transform:rotate(-6deg);margin:10px 0}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--yellow)}100%{}}

  tone(f, dur, type, vol, when, slide) {

// IndexedDB primary save + localStorage mirror. (No export/import: save codes could be edited to create god players.)
const Store = {
  db: null, KEY: 'career', LS: 'gridiron_life_v2',
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open('GridironLife', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res(); r.onblocked = () => res();
      } catch (e) { res(); }
    });
  },
  idbGet(key) {
    return new Promise((res) => {
      if (!this.db) { res(null); return; }
      try { const q = this.db.transaction('kv', 'readonly').objectStore('kv').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); }
    });
  },
  idbSet(key, val) {
    return new Promise((res) => {
      if (!this.db) { res(); return; }
      try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(); tx.onerror = () => res(); } catch (e) { res(); }
    });
  },
  async get(key) {
    const a = await Promise.race([this.idbGet(key), new Promise((r) => setTimeout(() => r(null), 1500))]);
    let b = null;
    try { const s = localStorage.getItem(this.LS + '_' + key); if (s) b = JSON.parse(s); } catch (e) {}
    if (a && b) return (a.savedAt || 0) >= (b.savedAt || 0) ? a : b;
    return a || b;
  },
  async set(key, val) {
    val.savedAt = Date.now();
    // Write the localStorage mirror first so a slow or blocked IndexedDB can never leave us with no save at all.
    try { localStorage.setItem(this.LS + '_' + key, JSON.stringify(val)); } catch (e) {}
    await Promise.race([this.idbSet(key, val), new Promise((r) => setTimeout(r, 1500))]);
  },
  persist() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {} }
};

  px(8, 8, 3, 1, hair); px(13, 8, 3, 1, hair);

  else if (cfg.beard === 2) { px(7, 12, 10, 3, hair); px(10, 13, 4, 1, '#fff'); }

  else if (hs === 0) px(7, 4, 10, 3, hair);
  else if (hs === 1) px(9, 3, 6, 4, hair);

function yearlyGrowth() {
  const en = [];

    if (!d) return;

    else G.ab[k] = clamp(before + d, 20, 80);
    const real = G.ab[k] - before;
    // Aging also lowers the ceiling, so you can't simply buy the lost points back cheaply.
    if (real < 0 && G.stage === 'PRO') G.pot[k] = Math.max(20, G.pot[k] + real);
    if (real) en.push(`${shortLbl(k)} ${real > 0 ? '+' : ''}${real}`);
  };
  if (G.stage === 'HS') { add('spd', ri(0, 2)); add('brs', ri(0, 2)); add('pow', ri(1, 3)); add('agi', ri(0, 2)); add('iq', 1); }
  else if (G.stage === 'COL') { add('pow', ri(0, 2)); add('brs', ri(0, 1)); add('iq', ri(0, 1)); }

        add('pow', -(ri(0, 1) + Math.floor(y / 3)));

function hofCalc() {
  const proSeasons = G.hist.filter((h) => h.stage === 'PRO'), starts = proSeasons.reduce((s, h) => s + (STARTS(h.role) ? 1 : h.role === 'Situational' ? 0.5 : 0), 0);
  const colScore = hcount('allam') * 25 + hcount('helmet') * 45 + hcount('natcol') * 20 + hcount('allconf') * 6 + hcount('allconf2') * 3 + (G.colFame || 0) * 0.15;
  const proScore = hcount('allpro') * 14 + hcount('allpro2') * 6 + hcount('allstar') * 5 + hcount('mvp') * 20 + hcount('league') * 6 + starts * 1.5 + Math.max(0, G.peakOvr - 64) * 3 + clamp(statUnits() * 3, 0, 30);
  return { col: colScore >= 60, pro: proSeasons.length >= 5 && proScore >= HOF_BAR, first: proScore >= HOF_FIRST, score: Math.round(proScore), colScore: Math.round(colScore), seasons: proSeasons.length };
}
function retire() {
  if (G.phase === 'season' && G.S && G.S.gi > 0 && !G.S.ended) return;
  G.hof = hofCalc();
  G.stage = 'RET'; G.phase = 'retired'; G.retiredYear = G.year; G.off = null; G.offQ = [];
  addFeed('gold', B('Retirement', 'Retiro'), B(`Pro HOF score ${G.hof.score} (${HOF_BAR} needed) · College HOF score ${G.hof.colScore} (60 needed).`, `Puntaje HOF Pro ${G.hof.score} (se necesita ${HOF_BAR}) · Puntaje HOF Universitario ${G.hof.colScore} (se necesita 60).`));
  META.careers = (META.careers || 0) + 1;
  if (G.proId || G.accrued > 0) META.unlock.goldVisor = true;
  if (G.hof.pro) META.unlock.goldJersey = true;
  if (G.hof.pro || G.hof.col) addHallEntry();
  saveMeta();
  Ads.gameplayStop();
  SFX.play(G.hof.pro ? 'td' : 'whistle');
  save(); renderAll();
}

const swKey = (k) => (isSkill(k) ? `${G.posGroup}_${k}` : k);

function swLists() {
  const a = G.ab, w = PG().w, keys = ATTR_KEYS.slice();
  const str = keys.slice().sort((x, y) => (a[y] + w[y] * 25) - (a[x] + w[x] * 25)).slice(0, 3);
  const mean = keys.reduce((s, k) => s + a[k], 0) / keys.length;
  const pool = keys.filter((k) => !str.includes(k)).sort((x, y) => (a[x] - w[x] * 30) - (a[y] - w[y] * 30));
  let weak = pool.filter((k) => a[k] <= mean - 3 || a[k] < 45).slice(0, 3);
  if (!weak.length) weak = keys.filter((k) => !str.includes(k)).sort((x, y) => a[x] - a[y]).slice(0, 1);
  return { str, weak };
}

const PG_TIERS = [[7.5, B('Future All-League talent', 'Futuro talento All-Liga')], [7.0, B('All-Star caliber starter', 'Titular de calibre All-Star')], [6.5, B('Year-1 starter', 'Titular desde el primer año')],

  [5.1, B('Developmental / special-teams value', 'Proyecto de desarrollo / equipos especiales')], [0, B('Priority free agent', 'Agente libre prioritario')]];
const pgTier = (g) => PG_TIERS.find((t) => g >= t[0])[1];
function hsProjection(ceil) {

function radarSVG() {
  const keys = ATTR_KEYS, n = keys.length, R = 64, k4 = keyAttrs();
  const pt = (i, v) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / n, r = R * clamp((v - 20) / 60, 0.03, 1.5); return [Math.cos(ang) * r, Math.sin(ang) * r]; };
  const poly = (f) => keys.map((k, i) => pt(i, f(k)).map((x) => x.toFixed(1)).join(',')).join(' ');
  let g = [35, 50, 65, 80].map((v) => `<polygon points="${poly(() => v)}" class="rg${v === 50 ? ' avg' : ''}"/>`).join('');
  keys.forEach((k, i) => {
    const [x, y] = pt(i, 80), [lx, ly] = pt(i, 99);
    g += `<line x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rg"/><text x="${lx.toFixed(1)}" y="${(ly - 4).toFixed(1)}" class="rl${k4.includes(k) ? ' rk' : ''}">${shortLbl(k)}</text><text x="${lx.toFixed(1)}" y="${(ly + 8).toFixed(1)}" class="rn">${G.ab[k]}</text>`;
  });
  g += `<polygon points="${poly((k) => Math.max(G.pot[k], G.ab[k]))}" class="rp"/><polygon points="${poly((k) => G.ab[k])}" class="rv"/>`;
  keys.forEach((k, i) => { const [x, y] = pt(i, G.ab[k]); g += `<rect x="${(x - 2).toFixed(1)}" y="${(y - 2).toFixed(1)}" width="4" height="4" class="rd"/>`; });
  return `<svg class="radar" viewBox="-108 -100 216 200" role="img" aria-label="${L('Ratings radar', 'Radar de atributos')}">${g}</svg>`;
}

function spend(k) {
  const isDice = G.phase === 'train';
  if (isDice && G.diceIdx >= G.dice.length) return;
  if (!isDice && G.bonusPts <= 0) return;
  const pts = isDice ? G.dice[G.diceIdx] : 1, before = G.ab[k];
  G.undo.push({ k, v: G.ab[k], c: G.carry[k], pts });
  applyPoints(G.ab, G.pot, G.carry, k, pts);
  if (isDice) G.diceIdx++; else G.bonusPts--;
  const d = G.ab[k] - before;
  toast(`${shortLbl(k)} ${d > 0 ? '+' + d : L('+' + pts + ' stored', '+' + pts + ' guardado')}`, 'good');
  SFX.play('spend');
}
let STRAT = null; // QA only: 'skill' = dump every point into the two position skills
function autoSpend() {
  const w = PG().w;
  const gain = (k, pts) => {
    const ab = { [k]: G.ab[k] }, pot = { [k]: G.pot[k] }, carry = { [k]: G.carry[k] || 0 };
    applyPoints(ab, pot, carry, k, pts);
    return ((ab[k] - G.ab[k]) + (carry[k] - (G.carry[k] || 0)) * 0.25 / lvCost(k, ab[k], G.pot[k])) * (w[k] + 0.02);
  };
  const choose = () => {
    if (STRAT === 'skill') { const s = ['sk1', 'sk2'].filter((k) => G.ab[k] < 80); if (s.length) return s.sort((x, y) => G.ab[x] - G.ab[y])[0]; }
    const pts = G.phase === 'train' ? G.dice[G.diceIdx] : 1, ok = ATTR_KEYS.filter((k) => G.ab[k] < 80);
    if (!ok.length) return 'sk1';
    return ok.sort((a, b) => gain(b, pts) - gain(a, pts))[0];
  };
  toast.quiet = true;
  if (G.phase === 'train') while (G.diceIdx < G.dice.length) spend(choose());
  else while (G.bonusPts > 0) spend(choose());
  toast.quiet = false;

  autoplay(maxSteps) {
    let n = 0;
    const step = () => {
      if (!G || G.phase === 'retired') return false;
      const O = G.off;
      switch (G.phase) {
        case 'loading': return true;
        case 'train': autoSpend(); ACT.confirmTrain(); return true;
        case 'event': resolveEvent(['bold', 'norm', 'safe'][n % 3]); return true;
        case 'season': if (G.S.ended) finishSeason(); else if (G.S.gi >= G.S.reg) playGame(true); else simSeason(); return true;
        case 'bonus': autoSpend(); ACT.confirmBonus(); return true;
        case 'off':
          switch (O.type) {
            case 'info': ACT.ok(); break;
            case 'hsTransfer': ACT.transfer({ i: 0 }); break;
            case 'earlyOffers': ACT.commit({ v: O.offers[0] }); break;
            case 'signing': ACT.sign({ i: 0 }); break;
            case 'nil': ACT.nil({ i: n % 2 }); break;
            case 'portal': ACT.ok(); break;
            case 'draftDecision': if (O.forced || ovr() >= 60) ACT.declare(); else ACT.return(); break;
            case 'combine': if (O.done) ACT.ok(); else ACT.combine({ m: 'full' }); break;
            case 'draft': if (!O.revealed) ACT.reveal(); else ACT.ok(); break;
            case 'udfa': if (O.offers.length) ACT.udfa({ i: 0 }); else ACT.retire(); break;
            case 'agent': ACT.agent({ i: 1 }); break;
            case 'rookie': ACT.signRookie(); break;
            case 'rfa': ACT.testMarket(); break;
            case 'tag': ACT.holdout(); break;
            case 'tradeAsk': if (n % 2) ACT.tradeReq(); else ACT.ok(); break;
            case 'neg': if (n % 3 === 2 && O.kind === 'resign') ACT.testFA(); else if (n % 2) { ACT.askAdj({ v: 2 }); ACT.submitAsk(); } else ACT.acceptOffer(); break;
            case 'fa': if (O.offers.length && O.day >= 2) ACT.faAccept({ i: 0 }); else if (O.offers.length > 1 && !O.lev) ACT.faLev({ i: 0 }); else if (O.day < 5) ACT.faWait(); else ACT.retire(); break;
            case 'retireAsk': if (G.age >= 34) ACT.retire(); else ACT.continueCareer(); break;
            default: return false;
          }
          return true;
      }
      return false;
    };
    while (n < (maxSteps || 3000)) { n++; if (!step()) break; }
    return { steps: n, phase: G && G.phase, year: G && G.year, age: G && G.age, stage: G && G.stage, hof: G && G.hof, earn: G && grossEarn(), honors: G && G.honors.length };
  }
};
if (!DEV_HOST) window.GridironLife = { setBgm: (url) => BGM.set(url) }; // release build: no state/cheat hooks

/* =====================================================================
   18. BOOT
   ===================================================================== */
(async function boot() {
  Store.persist();
  await Store.open();
  const s = await loadAll();
  savedCareer = s;
  if (s) Object.assign(avatar, s.av || {});
  renderTitle();
  await Ads.init();
  Ads.loadingFinished();
  const params = new URLSearchParams(location.search);
  if (params.get('lang') === 'es') { lang = 'es'; renderTitle(); }
  const devHost = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (params.get('autostart') === '1' && devHost) {
    CR.seed = params.get('seed') || 'qa-seed';
    const sub = params.get('pos');
    if (sub) { const pg = Object.keys(POS_GROUPS).find((k) => POS_GROUPS[k].subs.includes(sub)); if (pg) { CR.pg = pg; CR.sub = sub; } }
    startCareer();
  }
})();
})();
</script>
